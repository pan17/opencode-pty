name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        quality: [test, typecheck, lint, format]
    # All `test/` integration tests use `portableNode()` (see
    # test/utils.ts) so the same PTY commands run identically on
    # Windows and POSIX. CI runs on Windows because the matrix tests
    # exercise PTY-spawning helpers whose semantics differ across
    # platforms (conpty vs. unix PTY allocation, CreateProcessW
    # PATHEXT behaviour, etc.) — running the tests where the plugin
    # is actually shipped (Windows + Node ESM) keeps CI honest.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun build:prod

      - name: Run quality step
        run: bun ${{matrix.quality}}

  # E2E tests use bash and are Linux-only. Run on Ubuntu without the
  # heavy Nix/Devenv overhead.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun build:prod

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: PW_DISABLE_TS_ESM=1 NODE_ENV=test bun --bun playwright test

  dependency-review:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4


